<svg role="img" aria-labelledby="episod-arch-title episod-arch-desc" viewBox="0 0 960 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <title id="episod-arch-title">Episod System Architecture</title>
  <desc id="episod-arch-desc">Architecture diagram showing client interaction with the Episod gateway tier—including ingress streaming, episodic DAG SQLite store, tool approval gate, and consistent hash ring prefix routing—forwarding requests to upstream vLLM, SGLang, and Ollama inference engines.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text {
        user-select: none;
      }
    </style>
    <marker id="arrow-black" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Tier 1: Client Zone -->
  <rect x="32" y="60" width="176" height="368" rx="8" fill="rgba(0,0,0,0.015)" stroke="#000000" stroke-width="0.8" stroke-dasharray="4,4"/>
  <rect x="48" y="54" width="72" height="14" rx="2" fill="#ffffff"/>
  <text x="84" y="64" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">CLIENTS</text>

  <!-- Tier 2: Episod Gateway Zone -->
  <rect x="232" y="60" width="464" height="368" rx="8" fill="rgba(0,0,0,0.02)" stroke="#000000" stroke-width="1.2"/>
  <rect x="252" y="54" width="180" height="14" rx="2" fill="#ffffff"/>
  <text x="342" y="64" fill="#000000" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">EPISOD GATEWAY (RUST)</text>

  <!-- Tier 3: Inference Cluster Zone -->
  <rect x="720" y="60" width="208" height="368" rx="8" fill="rgba(0,0,0,0.015)" stroke="#000000" stroke-width="0.8" stroke-dasharray="4,4"/>
  <rect x="740" y="54" width="144" height="14" rx="2" fill="#ffffff"/>
  <text x="812" y="64" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">INFERENCE ENGINES</text>

  <!-- CONNECTORS -->
  <!-- 1. Client App -> Ingress (Straight) -->
  <line x1="192" y1="156" x2="256" y2="156" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-black)"/>
  <rect x="204" y="136" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="224" y="145" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP/SSE</text>

  <!-- 2. Ingress <-> DAG Store (Straight) -->
  <line x1="440" y1="156" x2="488" y2="156" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-black)"/>
  <rect x="448" y="136" width="32" height="12" rx="2" fill="#ffffff"/>
  <text x="464" y="145" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">DAG</text>

  <!-- 3. Ingress -> Tool & HITL Engine (Straight vertical) -->
  <line x1="348" y1="200" x2="348" y2="272" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-black)"/>
  <rect x="356" y="230" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="380" y="239" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">TOOL CALL</text>

  <!-- 4. Tool & HITL -> Human Operator (Approval Required - dashed) -->
  <line x1="256" y1="304" x2="192" y2="304" stroke="#000000" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)"/>
  <rect x="200" y="284" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="224" y="293" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">APPROVAL</text>

  <!-- 5. Human Operator -> Tool & HITL (Approved Sign-off) -->
  <line x1="192" y1="328" x2="256" y2="328" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-black)"/>
  <rect x="204" y="308" width="40" height="12" rx="2" fill="#ffffff"/>
  <text x="224" y="317" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">CONFIRM</text>

  <!-- 6. DAG Store -> Hash Ring (Straight vertical) -->
  <line x1="580" y1="200" x2="580" y2="272" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-black)"/>
  <rect x="588" y="230" width="56" height="12" rx="2" fill="#ffffff"/>
  <text x="616" y="239" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">PREFIX KEY</text>

  <!-- 7. Hash Ring -> Worker 1 (vLLM - Orthogonal Elbow r=8) -->
  <path d="M 672,296 H 700 Q 708,296 708,288 V 142 Q 708,134 716,134 H 744" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-black)"/>
  <rect x="684" y="208" width="48" height="12" rx="2" fill="#ffffff"/>
  <text x="708" y="217" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">PINNED KV</text>

  <!-- 8. Hash Ring -> Worker 2 (SGLang - Orthogonal Elbow r=8) -->
  <path d="M 672,316 H 688 Q 696,316 696,308 V 238 Q 696,230 704,230 H 744" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-black)"/>

  <!-- 9. Hash Ring -> Worker 3 (Ollama - Straight Horizontal) -->
  <line x1="672" y1="336" x2="744" y2="336" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-black)"/>

  <!-- NODE BOXES -->
  <!-- Node 1: Client App -->
  <rect x="48" y="112" width="144" height="88" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="56" y="120" width="56" height="14" rx="2" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="84" y="130" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">SDK / HTTP</text>
  <text x="120" y="156" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client App</text>
  <text x="120" y="174" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Python • cURL • TS</text>

  <!-- Node 2: Human Operator -->
  <rect x="48" y="272" width="144" height="88" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="56" y="280" width="56" height="14" rx="2" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="84" y="290" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">OPERATOR</text>
  <text x="120" y="316" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reviewer / HITL</text>
  <text x="120" y="334" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Web Console • /approve</text>

  <!-- Node 3: Ingress Router -->
  <rect x="256" y="112" width="184" height="88" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="264" y="120" width="48" height="14" rx="2" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="288" y="130" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">ROUTER</text>
  <text x="348" y="156" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingress &amp; Streamer</text>
  <text x="348" y="174" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OpenAI Drop-In • SSE</text>

  <!-- Node 4: Episodic DAG Store (FOCAL INVERTED) -->
  <rect x="488" y="112" width="184" height="88" rx="6" fill="#000000" stroke="#000000" stroke-width="1.2"/>
  <rect x="496" y="120" width="44" height="14" rx="2" fill="transparent" stroke="#ffffff" stroke-width="0.8"/>
  <text x="518" y="130" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">STATE</text>
  <text x="580" y="156" fill="#ffffff" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Episodic DAG Store</text>
  <text x="580" y="174" fill="#cccccc" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite WAL • Fork/Turn</text>

  <!-- Node 5: Tool & HITL Orchestrator -->
  <rect x="256" y="272" width="184" height="88" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="264" y="280" width="48" height="14" rx="2" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="288" y="290" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">POLICY</text>
  <text x="348" y="316" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tool &amp; HITL Engine</text>
  <text x="348" y="334" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Client-Delegated • HITL</text>

  <!-- Node 6: Consistent Hash Ring -->
  <rect x="488" y="272" width="184" height="88" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="496" y="280" width="56" height="14" rx="2" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="524" y="290" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">AFFINITY</text>
  <text x="580" y="316" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Consistent Hash Ring</text>
  <text x="580" y="334" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KV-Cache Prefix Router</text>

  <!-- Node 7: vLLM Instance -->
  <rect x="744" y="100" width="160" height="68" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="752" y="108" width="52" height="14" rx="2" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="778" y="118" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">NODE 01</text>
  <text x="824" y="136" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">vLLM Cluster</text>
  <text x="824" y="152" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vllm-node-1:8000</text>

  <!-- Node 8: SGLang Instance -->
  <rect x="744" y="196" width="160" height="68" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="752" y="204" width="52" height="14" rx="2" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="778" y="214" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">NODE 02</text>
  <text x="824" y="232" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SGLang Worker</text>
  <text x="824" y="248" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RadixAttention :30000</text>

  <!-- Node 9: Ollama Local -->
  <rect x="744" y="302" width="160" height="68" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <rect x="752" y="310" width="52" height="14" rx="2" fill="transparent" stroke="#000000" stroke-width="0.8"/>
  <text x="778" y="320" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">NODE 03</text>
  <text x="824" y="338" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ollama Local</text>
  <text x="824" y="354" fill="#555555" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">localhost:11434</text>

  <!-- LEGEND STRIP -->
  <line x1="32" y1="456" x2="928" y2="456" stroke="#000000" stroke-width="0.8"/>
  <text x="32" y="478" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

  <line x1="104" y1="475" x2="136" y2="475" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-black)"/>
  <text x="144" y="478" fill="#555555" font-size="8" font-family="'Geist Mono', monospace">Synchronous Flow</text>

  <rect x="296" y="469" width="16" height="12" rx="2" fill="#000000"/>
  <text x="320" y="478" fill="#555555" font-size="8" font-family="'Geist Mono', monospace">Stateful Storage (SQLite WAL)</text>

  <line x1="536" y1="475" x2="568" y2="475" stroke="#000000" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)"/>
  <text x="576" y="478" fill="#555555" font-size="8" font-family="'Geist Mono', monospace">Approval / Async Signal</text>

  <path d="M 760,478 H 772 Q 776,478 776,474 V 472 Q 776,468 780,468 H 788" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-black)"/>
  <text x="796" y="478" fill="#555555" font-size="8" font-family="'Geist Mono', monospace">Prefix-Affinity Route</text>
</svg>
