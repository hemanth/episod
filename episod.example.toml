# Episod Configuration Example

[server]
host = "0.0.0.0"
port = 8080

# Upstream generic inference backends (vLLM, SGLang, Ollama, OpenAI, LiteLLM)
# Requests are routed using a consistent hash ring on session ID to maximize KV-cache reuse.
[[upstreams]]
id = "vllm-replica-1"
url = "http://127.0.0.1:8000/v1"
weight = 1

[[upstreams]]
id = "vllm-replica-2"
url = "http://127.0.0.1:8001/v1"
weight = 1

[storage]
# Options: "sqlite" (default) | "redis" (distributed multi-pod) | "memory" (ephemeral)
storage_type = "sqlite"
database_path = "episod.db"

# Redis configuration (for multi-replica / Kubernetes deployments):
# storage_type = "redis"
# redis_url = "redis://127.0.0.1:6379" # or via REDIS_URL environment variable
# ttl_seconds = 604800 # 7 days retention
